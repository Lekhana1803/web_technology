<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Login</title>
</head>
<body style="background-color:#f0f2f5; font-family: Arial, sans-serif;">

  
  <h1 style="color: blue; text-align: right; padding: 20px 100px ;">
    Facebook
  </h1>

  
  <div style="background-color: white; border: 1px solid whitesmoke; width: 350px; padding: 20px; margin: 40px 100px 0 auto; border-radius: 8px; box-shadow: 0 2px 8px  whitesmoke;">
    
    <form>
     
      <input type="text" placeholder="Email address or phone number" 
             style="width: 90%; padding: 12px; margin: 8px ; border: 1px solid gray; border-radius: 5px;">
      
      
      <input type="password" placeholder="Password" 
             style="width: 90%; padding: 12px; margin: 8px ; border: 1px solid gray; border-radius: 5px;">
      
      
      <input type="submit" value="Log In" 
             style="width: 100%; padding: 12px; background-color: blue; color: white; border: none; border-radius: 5px; font-size: 16px; margin: 10px 0; cursor: pointer;">
      
      
      <div style="text-align: center; margin: 10px 0;">
        <a href="#" style="color:blue;  font-size: 14px;">Forgotten password?</a>
      </div>
      
      <hr style="margin: 20px 0;">
      
      
      <input type="button" value="Create New Account" 
             style="width: 100%; padding: 12px; background-color:blue; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">
    </form>
  </div>
</body>
</html>
